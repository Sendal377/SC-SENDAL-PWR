<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Formatter</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Top Nav */
        .top-nav {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            color: #38bdf8;
            border-color: #38bdf8;
        }

        .nav-btn.active {
            background: #0ea5e9;
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(14, 165, 233, 0.4);
        }

        /* Card Base Style */
        .card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        .textarea-wrapper {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 6px;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            padding: 10px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.2);
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .action-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: #94a3b8;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .action-btn:hover {
            color: #fff;
            border-color: #38bdf8;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #f8fafc;
        }

        .stat-label {
            font-size: 9px;
            color: #64748b;
            text-transform: uppercase;
        }

        /* Table Header */
        .table-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        th {
            color: #38bdf8;
            padding: 10px;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(56, 189, 248, 0.1);
            text-align: left;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: #cbd5e1;
        }

        /* STYLE WARNA BANK & E-WALLET */
        .bank-badge {
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 2px;
            display: inline-block;
            text-align: center;
            width: 75px;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        /* BANK / WALLET COLOR STYLES */
        .bank-bri { background-color: #d0e17d; color: #1a2301; }
        .bank-bca { background-color: #0000ff; color: #ffffff; }
        .bank-dana { background-color: #00ffff; color: #000000; }
        .bank-ovo { background-color: #8b5cf6; color: #ffffff; }
        .bank-linkaja { background-color: #ef4444; color: #ffffff; }
        .bank-mandiri { background-color: #a855f7; color: #ffffff; }
        .bank-bni { background-color: #f97316; color: #ffffff; }
        .bank-default { background-color: #334155; color: #ffffff; }

        .empty-row {
            text-align: center;
            color: #64748b;
            padding: 20px;
            font-style: italic;
        }

        .footer {
            margin-top: 15px;
            text-align: center;
            font-size: 9px;
            color: #475569;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Nav (Nama diubah menjadi SC PWR) -->
        <div class="top-nav">
            <button class="nav-btn active" onclick="switchTab(this, 'ROBOT_PWR')"><i data-lucide="bot"></i> SC PWR</button>
        </div>

        <!-- Input Box -->
        <div class="card">
            <div class="section-header">
                <i data-lucide="dot" style="color: #22c55e;"></i>
                TEMPEL DATA DARI TRANSAKSI ZONAMAIN / EXCEL
            </div>
            <div class="textarea-wrapper">
                <textarea id="dataInput" oninput="parseExcelData()" placeholder="Tempel/copy data Excel langsung di sini..."></textarea>
                <div class="action-btns">
                    <button class="action-btn" onclick="clearAll()"><i data-lucide="rotate-ccw" size="12"></i> Clear</button>
                    <button class="action-btn" onclick="pasteText()"><i data-lucide="clipboard" size="12"></i> Paste</button>
                </div>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <i data-lucide="arrow-down-left" style="color: #38bdf8;"></i>
                <div>
                    <div class="stat-value" id="manualRecordsCount">0</div>
                    <div class="stat-label">Manual Records</div>
                </div>
            </div>
            <div class="stat-card">
                <i data-lucide="arrow-up-right" style="color: #22c55e;"></i>
                <div>
                    <div class="stat-value" id="autoRecordsCount">0</div>
                    <div class="stat-label">Auto Records</div>
                </div>
            </div>
            <div class="stat-card">
                <i data-lucide="wallet" style="color: #eab308;"></i>
                <div>
                    <div class="stat-value" id="totalNominalDisplay">Rp 0</div>
                    <div class="stat-label">Total Nominal</div>
                </div>
            </div>
        </div>

        <!-- Table Output -->
        <div class="card">
            <div class="table-header-bar">
                <div class="section-header" id="tableHeaderTitle">
                    <i data-lucide="bot" size="14"></i> HASIL AUTO SC PWR (E-WALLET VIRTUAL ACCOUNT)
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>BANK</th>
                            <th>NO REK</th>
                            <th>USER ID</th>
                            <th>NAMA REK</th>
                            <th>NOMINAL</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Render via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="footer">
            POWERED BY <span style="color: #38bdf8;">MONORA FORMATTER</span> - SECURED & ENCRYPTED SYSTEM
        </div>
    </div>

    <script>
        let parsedList = [];
        let currentTab = 'ROBOT_PWR';

        function switchTab(btnElement, tabName) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            currentTab = tabName;

            const headerTitle = document.getElementById('tableHeaderTitle');
            headerTitle.innerHTML = `<i data-lucide="bot" size="14"></i> HASIL AUTO SC PWR (E-WALLET VIRTUAL ACCOUNT)`;

            renderTable();
        }

        function parseExcelData() {
            const rawText = document.getElementById('dataInput').value.trim();
            
            if (!rawText) {
                parsedList = [];
                renderTable();
                return;
            }

            const lines = rawText.split('\n');
            parsedList = [];

            lines.forEach((line) => {
                let cleanLine = line.trim();
                if (!cleanLine) return;

                cleanLine = cleanLine.replace(/^\d+\s+(?=\d{4}-\d{2}-\d{2})/, '');

                let cols = cleanLine.split('\t').map(c => c.trim()).filter(c => c !== '');
                
                let userId = '-';
                let noRek = '-';
                let bank = '-';
                let nama = '-';
                let nominal = '0';

                if (cols.length >= 4) {
                    let startIndex = (cols[0].match(/^(APPROVED|REJECTED|PENDING)$/i) || cols[0].match(/^\d+$/)) ? 1 : 0;
                    
                    userId = cols[startIndex] || '-';
                    noRek = cols[startIndex + 1] || '-';
                    nama = cols[startIndex + 2] || '-';
                    nominal = cols[startIndex + 3] || '0';

                    for (let c of cols) {
                        let bMatch = c.match(/\b(BCA|BRI|BNI|MANDIRI|DANA|OVO|LINKAJA|CIMB|PERMATA)\b/i);
                        if (bMatch) {
                            bank = bMatch[0].toUpperCase();
                            break;
                        }
                    }
                } else {
                    let bankMatch = cleanLine.match(/\b(BCA|BRI|BNI|MANDIRI|DANA|OVO|LINKAJA|CIMB|PERMATA)\b/i);
                    bank = bankMatch ? bankMatch[0].toUpperCase() : '-';

                    let noRekMatch = cleanLine.match(/\b\d{8,16}\b/);
                    noRek = noRekMatch ? noRekMatch[0] : '-';

                    let nominalMatch = cleanLine.match(/\b\d{1,3}(?:[.,]\d{3})+\b/);
                    if (nominalMatch) {
                        nominal = nominalMatch[0];
                    } else {
                        let numbers = cleanLine.match(/\b\d{4,9}\b/g);
                        if (numbers) {
                            for (let num of numbers) {
                                if (num !== noRek) {
                                    nominal = parseInt(num).toLocaleString('en-US');
                                    break;
                                }
                            }
                        }
                    }

                    let textClean = cleanLine
                        .replace(/^(APPROVED|REJECTED|PENDING)\s+/i, '')
                        .replace(new RegExp(bank, 'gi'), '')
                        .replace(new RegExp(noRek, 'g'), '');

                    let parts = textClean.trim().split(/\s+/);
                    if (parts.length > 0) {
                        userId = parts[0];
                        let rawNama = parts.slice(1).join(' ');
                        nama = rawNama.replace(/\s+\d+[\d.,]*$/, '').trim();
                    }
                }

                parsedList.push({ bank, noRek, userId, nama, nominal, rawLine: cleanLine });
            });

            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (parsedList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-row">Data kosong. Silakan paste data di atas.</td></tr>`;
                document.getElementById('manualRecordsCount').innerText = 0;
                document.getElementById('autoRecordsCount').innerText = 0;
                document.getElementById('totalNominalDisplay').innerText = 'Rp 0';
                return;
            }

            let totalNominalSum = 0;
            let autoCount = 0;

            parsedList.forEach((item) => {
                let displayBank = item.bank;
                let displayNoRek = item.noRek;

                if (currentTab === 'ROBOT_PWR') {
                    let lineUpper = item.rawLine.toUpperCase();
                    if (lineUpper.includes('DANA') || displayBank === 'DANA') {
                        displayBank = 'DANA';
                        displayNoRek = displayNoRek !== '-' ? '3901' + displayNoRek : '-';
                    } else if (lineUpper.includes('OVO') || displayBank === 'OVO') {
                        displayBank = 'OVO';
                        displayNoRek = displayNoRek !== '-' ? '39358' + displayNoRek : '-';
                    } else if (lineUpper.includes('LINKAJA') || displayBank === 'LINKAJA') {
                        displayBank = 'LINKAJA';
                        displayNoRek = displayNoRek !== '-' ? '091100' + displayNoRek : '-';
                    }

                    if (['DANA', 'OVO', 'LINKAJA'].includes(displayBank)) {
                        autoCount++;
                    }
                }

                const numericNominal = parseInt(item.nominal.replace(/,/g, '').replace(/\./g, '')) || 0;
                totalNominalSum += numericNominal;

                let bankClass = 'bank-default';
                if (displayBank.includes('BRI')) bankClass = 'bank-bri';
                else if (displayBank.includes('BCA')) bankClass = 'bank-bca';
                else if (displayBank.includes('DANA')) bankClass = 'bank-dana';
                else if (displayBank.includes('OVO')) bankClass = 'bank-ovo';
                else if (displayBank.includes('LINKAJA')) bankClass = 'bank-linkaja';
                else if (displayBank.includes('MANDIRI')) bankClass = 'bank-mandiri';
                else if (displayBank.includes('BNI')) bankClass = 'bank-bni';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="bank-badge ${bankClass}">${displayBank}</span></td>
                    <td style="font-family: monospace;">${displayNoRek}</td>
                    <td style="color: #38bdf8;">${item.userId}</td>
                    <td>${item.nama}</td>
                    <td style="font-weight: bold; color: #f8fafc;">${item.nominal}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('manualRecordsCount').innerText = parsedList.length - autoCount;
            document.getElementById('autoRecordsCount').innerText = autoCount;
            document.getElementById('totalNominalDisplay').innerText = 'Rp ' + totalNominalSum.toLocaleString('id-ID');

            lucide.createIcons();
        }

        function clearAll() {
            document.getElementById('dataInput').value = '';
            parseExcelData();
        }

        async function pasteText() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('dataInput').value = text;
                parseExcelData();
            } catch (err) {
                alert('Gunakan CTRL+V pada kolom teks jika tidak bisa paste otomatis.');
            }
        }

        parseExcelData();
    </script>
</body>
</html>
